name: Verify release tag

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*"

jobs:
  verify-version:
    runs-on: macos-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Verify tag and About version source
        run: ./scripts/verify-release-version.sh "$GITHUB_REF_NAME"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project and build app
        run: |
          xcodegen generate
          xcodebuild \
            -project AIUsage.xcodeproj \
            -scheme AIUsage \
            -configuration Release \
            -derivedDataPath .build/tag-verification \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify built About version
        run: |
          ./scripts/verify-release-version.sh \
            "$GITHUB_REF_NAME" \
            ".build/tag-verification/Build/Products/Release/AIUsage.app"
