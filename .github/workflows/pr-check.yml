name: PR checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "版本 PR 的 main 基准提交"
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-check-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install xcodegen

      - name: Validate remote Issue and branch association
        if: ${{ !startsWith(github.head_ref || github.ref_name, 'codex/release-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
        run: python3 scripts/check-preparation.py --base "$BASE_REF" --github

      - name: Verify update process, tests, and built version
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
          PR_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: make verify ARCH="${{ matrix.arch }}" BASE_REF="$BASE_REF"
