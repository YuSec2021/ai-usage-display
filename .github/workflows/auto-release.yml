name: Automatic release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automatic-release-main
  cancel-in-progress: false

jobs:
  version:
    name: Prepare release version
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare or reuse release version
        id: version
        run: python3 scripts/bump-release-version.py >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        if: steps.version.outputs.changed == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install xcodegen

      - name: Generate and validate version metadata
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          make generate
          ./scripts/verify-release-version.sh "$RELEASE_TAG"
          git diff --check

      - name: Commit version and push tag atomically
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project.yml AIUsage.xcodeproj README.md CHANGELOG.md docs/changelog
          git commit -m "chore(release): $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"

  release:
    name: Build and publish release
    needs: version
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
