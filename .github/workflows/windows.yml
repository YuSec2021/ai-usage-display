name: Windows

on:
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
      - '.github/workflows/release.yml'
      - 'project.yml'
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
      - '.github/workflows/release.yml'
      - 'project.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: '可选：验证已有版本 Tag 的 Windows 包，不发布 Release'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-${{ inputs.tag || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ !inputs.tag }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      REQUESTED_TAG: ${{ inputs.tag || '' }}
    steps:
      - name: Validate requested tag
        shell: pwsh
        run: |
          if ($env:REQUESTED_TAG -and $env:REQUESTED_TAG -notmatch '^v?[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Version tag must use vX.Y.Z or X.Y.Z'
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test isolated domain and providers
        run: dotnet test windows/AIUsage.Core.Tests/AIUsage.Core.Tests.csproj -c Release --logger "trx;LogFileName=core.trx"
      - name: Publish native self-contained app
        run: dotnet publish windows/AIUsage.Windows/AIUsage.Windows.csproj -c Release -r win-x64 --self-contained true -o dist/windows-x64 -p:Platform=x64
      - name: Package portable build and checksum
        shell: pwsh
        run: |
          $version = ([regex]::Match((Get-Content project.yml -Raw), 'MARKETING_VERSION:\s*([\d.]+)')).Groups[1].Value
          if (-not $version) { throw 'Version missing' }
          if ($env:REQUESTED_TAG -and $env:REQUESTED_TAG.TrimStart('v') -ne $version) {
            throw 'Requested tag does not match project version'
          }
          Copy-Item docs/windows/README.md dist/windows-x64/README.md
          $name = "AI-Usage-Windows-$version-x64-preview.zip"
          Compress-Archive -Path dist/windows-x64/* -DestinationPath "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name`n" | Set-Content -Encoding ascii -NoNewline "dist/$name.sha256"
      - name: Verify extracted portable app, tray, and collector
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist/AI-Usage-Windows-*-x64-preview.zip | Select-Object -First 1
          $portable = Join-Path $env:RUNNER_TEMP 'AI Usage Portable'
          Expand-Archive -Path $archive.FullName -DestinationPath $portable
          ./windows/scripts/smoke.ps1 -Executable (Join-Path $portable 'AIUsage.Windows.exe') -Output "$env:RUNNER_TEMP/ai-usage-smoke"
      - name: Upload native verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: |
            ${{ runner.temp }}/ai-usage-smoke
            windows/AIUsage.Core.Tests/TestResults
          if-no-files-found: warn
      - name: Upload portable preview
        uses: actions/upload-artifact@v4
        with:
          name: AI-Usage-Windows-x64-preview
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
