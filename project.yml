name: AIUsage
options:
  bundleIdPrefix: com.yusec
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  AIUsage:
    type: application
    platform: macOS
    sources:
      - path: Sources/AIUsage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yusec.aiusage
        PRODUCT_NAME: AIUsage
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: AI Usage
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 YuSec
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - AIUsageTests
  AIUsageTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AIUsageTests
    dependencies:
      - target: AIUsage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yusec.aiusage.tests
        GENERATE_INFOPLIST_FILE: YES
